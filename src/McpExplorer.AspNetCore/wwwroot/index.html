<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%234f46e5%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel-2:#f1f3f6;--border:#dfe3e8;--text:#1b1f24;--muted:#5f6b7a;
  --accent:#4f46e5;--accent-soft:#eef0ff;--ok:#0f8a4b;--ok-soft:#e6f6ee;--err:#c62828;--err-soft:#fdecec;--warn:#a15c00;--warn-soft:#fff4e0;
  --code:#0f172a;--code-text:#e2e8f0;--radius:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1117;--panel:#151b23;--panel-2:#1c232d;--border:#2a3340;--text:#e6edf3;--muted:#8b98a8;
  --accent:#8b8cff;--accent-soft:#23264a;--ok:#3fb950;--ok-soft:#12261a;--err:#ff6b6b;--err-soft:#2d1517;--warn:#e3a33b;--warn-soft:#2b2110;--code:#0a0e14;
}}
:root[data-theme=dark]{
  --bg:#0d1117;--panel:#151b23;--panel-2:#1c232d;--border:#2a3340;--text:#e6edf3;--muted:#8b98a8;
  --accent:#8b8cff;--accent-soft:#23264a;--ok:#3fb950;--ok-soft:#12261a;--err:#ff6b6b;--err-soft:#2d1517;--warn:#e3a33b;--warn-soft:#2b2110;--code:#0a0e14;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.logo .dot.on{background:var(--ok)}.logo .dot.off{background:var(--err)}
.server-meta{color:var(--muted);font-size:13px}
.endpoint{display:flex;gap:8px;flex:1;min-width:260px;max-width:640px;margin-left:auto}
.endpoint input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=url],input[type=email],input[type=date],input[type=datetime-local],input[type=password],select,textarea{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--panel-2);color:var(--muted)}
textarea{font-family:var(--mono);font-size:13px;min-height:90px;resize:vertical}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.6;cursor:default}
.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 57px)}
aside{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.search{padding:12px;border-bottom:1px solid var(--border)}
.tool-list{overflow:auto;flex:1;padding:6px}
.tool-item{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tool-item:hover{background:var(--panel-2)}
.tool-item.active{background:var(--accent-soft);border-color:var(--accent)}
.tool-item .name{font-family:var(--mono);font-size:13px;font-weight:600;word-break:break-all}
.tool-item .desc{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.count{color:var(--muted);font-size:12px;padding:4px 12px}
main{overflow:auto;padding:24px;min-width:0}
.empty{color:var(--muted);text-align:center;margin-top:80px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px}
.card-b{padding:16px}
.tool-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.tool-title h2{margin:0;font-family:var(--mono);font-size:20px;word-break:break-all}
.method{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--accent);color:#fff;padding:2px 8px;border-radius:6px}
.tool-desc{color:var(--muted);margin:0 0 16px;white-space:pre-wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.badge.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.badge.err{color:var(--err);background:var(--err-soft);border-color:transparent}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:none;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:flex;gap:6px;align-items:baseline;font-weight:600;margin-bottom:4px;flex-wrap:wrap}
.field .type{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.field .req{color:var(--err);font-size:11px;font-weight:600}
.field .hint{color:var(--muted);font-size:12px;margin-top:3px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--err)}
.nested{border-left:2px solid var(--border);padding-left:12px;margin-top:6px}
.arr-row{display:flex;gap:6px;margin-bottom:6px}
.check{display:flex;align-items:center;gap:8px;font-weight:400}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
pre{margin:0;background:var(--code);color:var(--code-text);padding:12px 14px;border-radius:8px;overflow:auto;font:12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:520px}
.block{margin-bottom:12px}
.block .bh{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.block img{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.status{display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)}
.error-box{background:var(--err-soft);color:var(--err);padding:10px 12px;border-radius:8px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.hdr-def{padding:10px 0;border-bottom:1px solid var(--border)}
.hdr-def:last-child{border-bottom:none}
.hdr-def .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.hdr-def .top code{font-weight:600}
.hdr-def .val{display:flex;gap:6px;align-items:center}
.section-t{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.section-t:first-child{margin-top:0}
.btn.attn{border-color:var(--err);color:var(--err)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);color:var(--text);width:min(560px,calc(100vw - 32px));padding:0}
dialog::backdrop{background:rgba(0,0,0,.4)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.instructions{white-space:pre-wrap;color:var(--muted);font-size:13px}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;height:auto}
  aside{border-right:none;border-bottom:1px solid var(--border);max-height:40vh}
  main{padding:16px}
  .endpoint{max-width:none;margin-left:0}
}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot" id="dot"></span><span id="title">{{TITLE}}</span></div>
  <div class="server-meta" id="serverMeta">Not connected</div>
  <div class="endpoint">
    <input type="text" id="endpoint" spellcheck="false" aria-label="MCP endpoint">
    <button class="btn" id="headersBtn" title="Request headers">Headers <span id="hdrCount"></span></button>
    <button class="btn primary" id="connectBtn">Connect</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="search"><input type="text" id="search" placeholder="Filter tools…" aria-label="Filter tools"></div>
    <div class="count" id="count"></div>
    <div class="tool-list" id="toolList"></div>
  </aside>
  <main id="main"><div class="empty">Connect to an MCP server to see its tools.</div></main>
</div>

<dialog id="headersDlg">
  <div class="card-h"><h3>Request headers</h3><span class="muted" style="font-size:12px">Sent to the MCP server with every list and call request. Values are stored in this browser only.</span></div>
  <div class="card-b">
    <div id="hdrDefs"></div>
    <div class="section-t">Custom headers</div>
    <div id="hdrRows"></div>
    <div id="hdrServer"></div>
    <div class="actions">
      <button class="btn small" id="addHdr">+ Add header</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="hdrClose">Save &amp; reconnect</button>
    </div>
  </div>
</dialog>

<script>
(() => {
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('mcpexplorer:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mcpexplorer:' + k, JSON.stringify(v)); } catch {} }
};

const state = { config: null, tools: [], selected: null, drafts: {}, hdr: loadHeaders() };

// ---------- Headers model ----------
// hdr = { values: {name: value}, disabled: {name: true}, custom: [{name, value, enabled}] }
function loadHeaders() {
  const h = store.get('headers', null);
  if (Array.isArray(h)) return { values: {}, disabled: {}, custom: h.map(x => ({ enabled: true, ...x })) }; // v0.1 format
  return { values: {}, disabled: {}, custom: [], ...(h || {}) };
}
const saveHeaders = () => { store.set('headers', state.hdr); updateHeaderBtn(); };
const defs = () => state.config?.headers || [];
const defValue = d => state.hdr.values[d.name] ?? d.defaultValue ?? '';
function activeHeaders() {
  const out = {};
  for (const d of defs()) { const v = defValue(d); if (v && !state.hdr.disabled[d.name]) out[d.name] = v; }
  for (const c of state.hdr.custom) if (c.name?.trim() && c.enabled !== false) out[c.name.trim()] = c.value ?? '';
  return out;
}
const serverHas = name => (state.config?.serverHeaders || []).some(n => n.toLowerCase() === name.toLowerCase());
const missingRequired = () => defs().filter(d => d.required && !serverHas(d.name) && !(defValue(d) && !state.hdr.disabled[d.name])).map(d => d.name);
function updateHeaderBtn() {
  const n = Object.keys(activeHeaders()).length, miss = missingRequired();
  $('#hdrCount').textContent = n ? `(${n})` : '';
  $('#headersBtn').classList.toggle('attn', miss.length > 0);
  $('#headersBtn').title = miss.length ? 'Required: ' + miss.join(', ') : 'Request headers';
}

// ---------- API ----------
async function api(path, body) {
  const headers = { 'Content-Type': 'application/json' };
  for (const [k, v] of Object.entries(activeHeaders())) headers['X-McpExplorer-Header-' + k] = v;
  const res = await fetch('api/' + path, { method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined });
  let data; try { data = await res.json(); } catch { data = { ok: false, error: 'HTTP ' + res.status }; }
  return data;
}

// ---------- Connect ----------
async function connect() {
  const btn = $('#connectBtn');
  const miss = missingRequired();
  if (miss.length) {
    $('#dot').className = 'dot off';
    $('#serverMeta').textContent = 'Headers required';
    $('#main').replaceChildren(el('div', { class: 'card' },
      el('div', { class: 'card-h' }, el('h3', { text: 'This MCP server needs headers' })),
      el('div', { class: 'card-b' }, el('p', { text: 'Fill in the required headers before connecting: ' + miss.join(', ') }),
        el('button', { class: 'btn primary', text: 'Open headers', onclick: openHeaders }))));
    return;
  }
  btn.disabled = true; btn.replaceChildren(el('span', { class: 'spin' }));
  $('#serverMeta').textContent = 'Connecting…';
  const endpoint = $('#endpoint').value;
  if (state.config.allowCustomEndpoint) store.set('endpoint', endpoint);
  const r = await api('connect', { endpoint });
  btn.disabled = false; btn.textContent = 'Reconnect';
  if (!r.ok) {
    $('#dot').className = 'dot off';
    $('#serverMeta').textContent = 'Connection failed';
    state.tools = []; renderList();
    $('#main').replaceChildren(el('div', { class: 'card' },
      el('div', { class: 'card-h' }, el('h3', { text: 'Could not connect' })),
      el('div', { class: 'card-b' }, el('div', { class: 'error-box', text: r.error || 'Unknown error' }))));
    return;
  }
  $('#dot').className = 'dot on';
  const s = r.server || {};
  $('#serverMeta').textContent = `${s.title || s.name || 'MCP server'} ${s.version ? 'v' + s.version : ''} · protocol ${r.protocolVersion || '?'} · ${r.elapsedMs} ms`;
  state.server = r;
  state.tools = (r.tools || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  renderList();
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const pick = state.tools.find(t => t.name === fromHash) || state.tools.find(t => t.name === state.selected?.name);
  if (pick) select(pick); else renderOverview();
}

function renderOverview() {
  state.selected = null; renderList();
  const r = state.server; if (!r) return;
  $('#main').replaceChildren(el('div', { class: 'card' },
    el('div', { class: 'card-h' }, el('h3', { text: r.server?.title || r.server?.name || 'Server' }), el('span', { class: 'badge', text: `${state.tools.length} tools` })),
    el('div', { class: 'card-b' },
      el('div', { class: 'muted', text: r.endpoint }),
      r.instructions ? el('p', { class: 'instructions', text: r.instructions }) : null,
      el('p', { text: 'Pick a tool on the left to see its schema and try it out.' }),
      el('details', {}, el('summary', { class: 'muted', text: 'Server capabilities' }), el('pre', { text: JSON.stringify(r.capabilities, null, 2) })))));
}

// ---------- Tool list ----------
function renderList() {
  const q = $('#search').value.trim().toLowerCase();
  const list = state.tools.filter(t => !q || t.name.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q) || (t.title || '').toLowerCase().includes(q));
  $('#count').textContent = state.tools.length ? `${list.length} of ${state.tools.length} tools` : '';
  $('#toolList').replaceChildren(...list.map(t => el('div', {
    class: 'tool-item' + (state.selected?.name === t.name ? ' active' : ''), onclick: () => select(t), title: t.name
  }, el('div', { class: 'name', text: t.name }), t.description ? el('div', { class: 'desc', text: t.description }) : null)));
}

// ---------- Schema helpers ----------
const typeOf = s => {
  if (!s) return 'any';
  let t = s.type;
  if (Array.isArray(t)) t = t.find(x => x !== 'null') || 'null';
  if (!t && s.enum) t = typeof s.enum[0] === 'number' ? 'number' : 'string';
  if (!t && s.properties) t = 'object';
  if (!t && (s.anyOf || s.oneOf)) return typeOf((s.anyOf || s.oneOf).find(x => x.type !== 'null'));
  return t || 'any';
};
const typeLabel = s => {
  const t = typeOf(s);
  if (t === 'array') return `array<${typeOf(s.items)}>`;
  return t + (s?.format ? ` (${s.format})` : '');
};
function exampleFor(s, depth = 0) {
  if (!s || depth > 6) return null;
  if (s.default !== undefined) return s.default;
  if (s.examples?.length) return s.examples[0];
  if (s.enum) return s.enum[0];
  switch (typeOf(s)) {
    case 'string': return s.format === 'date' ? new Date().toISOString().slice(0, 10) : s.format === 'date-time' ? new Date().toISOString() : '';
    case 'integer': case 'number': return 0;
    case 'boolean': return false;
    case 'array': return [];
    case 'object': { const o = {}; for (const [k, p] of Object.entries(s.properties || {})) if ((s.required || []).includes(k)) o[k] = exampleFor(p, depth + 1); return o; }
    default: return null;
  }
}

// ---------- Form generation ----------
// Each builder returns { node, get(): {value, set: bool, error?} , set(value) }
function buildField(name, schema, required) {
  schema = schema || {};
  const t = typeOf(schema);
  const id = 'f' + Math.random().toString(36).slice(2);
  const wrap = el('div', { class: 'field' });
  const lbl = el('label', { for: id }, name, el('span', { class: 'type', text: typeLabel(schema) }), required ? el('span', { class: 'req', text: 'required' }) : null);
  const hint = [schema.description, schema.minimum != null && `min ${schema.minimum}`, schema.maximum != null && `max ${schema.maximum}`, schema.pattern && `pattern ${schema.pattern}`].filter(Boolean).join(' · ');
  let input, get, set;

  if (schema.enum) {
    input = el('select', { id }, required ? null : el('option', { value: '', text: '— not set —' }),
      ...schema.enum.map((v, i) => el('option', { value: String(i), text: String(v) })));
    get = () => input.value === '' ? { set: false } : { set: true, value: schema.enum[+input.value] };
    set = v => { const i = schema.enum.findIndex(x => x === v); input.value = i < 0 ? '' : String(i); };
  } else if (t === 'boolean') {
    input = el('select', { id }, required ? null : el('option', { value: '', text: '— not set —' }), el('option', { value: 'true', text: 'true' }), el('option', { value: 'false', text: 'false' }));
    get = () => input.value === '' ? { set: false } : { set: true, value: input.value === 'true' };
    set = v => input.value = v == null ? (required ? 'false' : '') : String(!!v);
  } else if (t === 'integer' || t === 'number') {
    input = el('input', { id, type: 'number', step: t === 'integer' ? '1' : 'any', min: schema.minimum, max: schema.maximum, placeholder: schema.default ?? '' });
    get = () => {
      if (input.value === '') return { set: false };
      const n = Number(input.value);
      if (Number.isNaN(n) || (t === 'integer' && !Number.isInteger(n))) return { set: true, error: `${name}: must be ${t}` };
      return { set: true, value: n };
    };
    set = v => input.value = v ?? '';
  } else if (t === 'string') {
    const fmt = { date: 'date', 'date-time': 'datetime-local', email: 'email', uri: 'url', password: 'password' }[schema.format] || 'text';
    const long = (schema.maxLength || 0) > 200 || /text|content|body|query|prompt|message/i.test(name) && !schema.maxLength;
    input = long ? el('textarea', { id, rows: 3, placeholder: schema.default ?? '', style: 'font-family:inherit;min-height:60px' })
                 : el('input', { id, type: fmt, placeholder: schema.default ?? '', spellcheck: 'false' });
    get = () => {
      if (input.value === '') return { set: false };
      let v = input.value;
      if (fmt === 'datetime-local') v = new Date(v).toISOString();
      return { set: true, value: v };
    };
    set = v => { if (v == null) { input.value = ''; return; } input.value = fmt === 'datetime-local' ? String(v).slice(0, 16) : String(v); };
  } else if (t === 'object' && schema.properties) {
    const obj = buildObject(schema);
    wrap.append(...[el('div', { class: 'lbl' }, ...lbl.childNodes), hint ? el('div', { class: 'hint', text: hint }) : null, el('div', { class: 'nested' }, obj.node)].filter(Boolean));
    return { node: wrap, get: () => { const r = obj.get(); return r.error ? r : (Object.keys(r.value).length || required ? { set: true, value: r.value } : { set: false }); }, set: obj.set };
  } else if (t === 'array' && ['string', 'number', 'integer', 'boolean'].includes(typeOf(schema.items)) && !schema.items?.enum) {
    const rows = el('div');
    const add = v => {
      const f = buildField('', schema.items, true);
      const inp = f.node.querySelector('input,select,textarea');
      const row = el('div', { class: 'arr-row' }, inp, el('button', { class: 'btn small', type: 'button', text: '✕', title: 'Remove', onclick: () => { row.remove(); items.splice(items.indexOf(f), 1); } }));
      if (v !== undefined) f.set(v);
      items.push(f); rows.append(row);
    };
    const items = [];
    wrap.append(...[el('div', { class: 'lbl' }, ...lbl.childNodes), rows, el('button', { class: 'btn small', type: 'button', text: '+ Add item', onclick: () => add() }), hint ? el('div', { class: 'hint', text: hint }) : null].filter(Boolean));
    return {
      node: wrap,
      get: () => { const vals = []; for (const f of items) { const r = f.get(); if (r.error) return r; if (r.set) vals.push(r.value); } return vals.length || required ? { set: true, value: vals } : { set: false }; },
      set: v => { rows.replaceChildren(); items.length = 0; (Array.isArray(v) ? v : []).forEach(add); }
    };
  } else {
    input = el('textarea', { id, rows: 4, spellcheck: 'false', placeholder: JSON.stringify(exampleFor(schema)) });
    get = () => {
      if (input.value.trim() === '') return { set: false };
      try { return { set: true, value: JSON.parse(input.value) }; } catch (e) { return { set: true, error: `${name}: invalid JSON (${e.message})` }; }
    };
    set = v => input.value = v == null ? '' : JSON.stringify(v, null, 2);
  }
  wrap.append(lbl, input);
  if (hint) wrap.append(el('div', { class: 'hint', text: hint }));
  const setOrDefault = v => set(v === undefined ? schema.default : v);
  setOrDefault(undefined);
  return { node: wrap, get, set: setOrDefault };
}

function buildObject(schema) {
  const node = el('div'); const fields = {};
  const req = schema.required || [];
  const props = Object.entries(schema.properties || {}).sort(([a], [b]) => req.includes(b) - req.includes(a));
  for (const [k, p] of props) { fields[k] = buildField(k, p, req.includes(k)); node.append(fields[k].node); }
  return {
    node,
    get() {
      const value = {}; const errors = [];
      for (const [k, f] of Object.entries(fields)) {
        f.node.classList.remove('invalid');
        const r = f.get();
        if (r.error) { errors.push(r.error); f.node.classList.add('invalid'); }
        else if (r.set) value[k] = r.value;
        else if (req.includes(k)) { errors.push(`${k} is required`); f.node.classList.add('invalid'); }
      }
      return errors.length ? { error: errors.join('\n') } : { value };
    },
    set(v) { v = v || {}; for (const [k, f] of Object.entries(fields)) f.set(v[k]); }
  };
}

// ---------- Tool view ----------
function select(tool) {
  state.selected = tool; renderList();
  history.replaceState(null, '', '#' + encodeURIComponent(tool.name));
  const schema = tool.inputSchema || { type: 'object', properties: {} };
  const hasProps = Object.keys(schema.properties || {}).length > 0;
  const form = buildObject(schema);
  const json = el('textarea', { rows: 12, spellcheck: 'false' });
  let mode = 'form';

  const draft = state.drafts[tool.name];
  form.set(draft ?? schema.default ?? {});
  json.value = JSON.stringify(draft ?? exampleFor(schema) ?? {}, null, 2);

  const currentArgs = () => {
    if (mode === 'json') { try { return { value: json.value.trim() ? JSON.parse(json.value) : {} }; } catch (e) { return { error: 'Invalid JSON: ' + e.message }; } }
    return form.get();
  };
  const tabs = el('div', { class: 'tabs' });
  const setMode = m => {
    if (m === mode) return;
    if (m === 'json') { const r = form.get(); json.value = JSON.stringify(r.error ? {} : r.value, null, 2); }
    else { try { form.set(JSON.parse(json.value || '{}')); } catch { } }
    mode = m; formBox.hidden = m !== 'form'; jsonBox.hidden = m !== 'json';
    [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.m === m));
  };
  tabs.append(...[['form', 'Form'], ['json', 'JSON'], ['schema', 'Schema']].map(([m, label]) =>
    el('button', { class: 'tab' + (m === 'form' ? ' active' : ''), 'data-m': m, text: label, onclick: () => m === 'schema' ? toggleSchema() : setMode(m) })));

  const schemaBox = el('div', { hidden: true }, el('pre', { text: JSON.stringify(schema, null, 2) }),
    tool.outputSchema ? el('div', { class: 'block', style: 'margin-top:12px' }, el('div', { class: 'bh', text: 'Output schema' }), el('pre', { text: JSON.stringify(tool.outputSchema, null, 2) })) : null);
  const toggleSchema = () => { schemaBox.hidden = !schemaBox.hidden; tabs.querySelector('[data-m=schema]').classList.toggle('active', !schemaBox.hidden); };

  const formBox = el('div', {}, hasProps ? form.node : el('p', { class: 'muted', text: 'This tool takes no arguments.' }));
  const jsonBox = el('div', { hidden: true }, json);
  const errBox = el('div', { class: 'error-box', hidden: true, style: 'margin-bottom:10px' });
  const resultCard = el('div');

  const run = el('button', { class: 'btn primary', text: 'Execute', onclick: async () => {
    const a = currentArgs();
    errBox.hidden = !a.error; errBox.textContent = a.error || '';
    if (a.error) return;
    state.drafts[tool.name] = a.value;
    run.disabled = true; run.replaceChildren(el('span', { class: 'spin' }), ' Running…');
    const r = await api('call', { endpoint: $('#endpoint').value, tool: tool.name, arguments: a.value });
    run.disabled = false; run.textContent = 'Execute';
    resultCard.replaceChildren(renderResult(r, tool, a.value));
  }});
  const copyRpc = el('button', { class: 'btn', text: 'Copy JSON-RPC', title: 'Copy the raw tools/call request', onclick: () => {
    const a = currentArgs();
    copy(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call', params: { name: tool.name, arguments: a.value || {} } }, null, 2), copyRpc);
  }});
  const reset = el('button', { class: 'btn', text: 'Reset', onclick: () => { delete state.drafts[tool.name]; select(tool); } });

  const ann = tool.annotations || {};
  const badges = [
    ann.readOnlyHint && el('span', { class: 'badge ok', text: 'read-only' }),
    ann.destructiveHint && !ann.readOnlyHint && el('span', { class: 'badge err', text: 'destructive' }),
    ann.idempotentHint && el('span', { class: 'badge', text: 'idempotent' }),
    ann.openWorldHint && el('span', { class: 'badge warn', text: 'open-world' }),
    tool.outputSchema && el('span', { class: 'badge', text: 'structured output' }),
  ].filter(Boolean);

  $('#main').replaceChildren(...[
    el('div', { class: 'tool-title' }, el('span', { class: 'method', text: 'TOOL' }), el('h2', { text: tool.name }), ...badges),
    tool.title || ann.title ? el('div', { style: 'font-weight:600;margin-bottom:4px', text: tool.title || ann.title }) : null,
    el('p', { class: 'tool-desc', text: tool.description || 'No description.' }),
    el('div', { class: 'card' },
      el('div', { class: 'card-h' }, el('h3', { text: 'Arguments' }), tabs),
      el('div', { class: 'card-b' }, schemaBox, formBox, jsonBox, errBox, el('div', { class: 'actions' }, run, copyRpc, reset))),
    resultCard].filter(Boolean));
  $("#main").scrollTop = 0;
}

function renderResult(r, tool, args) {
  const body = el('div', { class: 'card-b' });
  let badge;
  if (!r.ok) {
    badge = el('span', { class: 'badge err', text: 'Request failed' });
    body.append(el('div', { class: 'error-box', text: r.error || 'Unknown error' }));
  } else {
    const res = r.result || {};
    badge = res.isError ? el('span', { class: 'badge err', text: 'Tool error (isError)' }) : el('span', { class: 'badge ok', text: 'Success' });
    const blocks = res.content || [];
    blocks.forEach((b, i) => body.append(renderBlock(b, i)));
    if (res.structuredContent !== undefined) body.append(el('div', { class: 'block' }, el('div', { class: 'bh', text: 'structuredContent' }), el('pre', { text: JSON.stringify(res.structuredContent, null, 2) })));
    if (!blocks.length && res.structuredContent === undefined) body.append(el('p', { class: 'muted', text: 'Empty result.' }));
    body.append(el('details', {}, el('summary', { class: 'muted', text: 'Raw response' }), el('pre', { text: JSON.stringify(res, null, 2) })));
  }
  return el('div', { class: 'card' },
    el('div', { class: 'card-h' }, el('h3', { text: 'Response' }), badge, el('span', { class: 'muted', text: `${r.elapsedMs ?? '?'} ms` }), el('span', { class: 'muted', style: 'margin-left:auto;font-size:12px', text: new Date().toLocaleTimeString() })),
    body);
}

function renderBlock(b, i) {
  const head = el('div', { class: 'bh' }, el('span', { text: `#${i + 1} ${b.type}` }));
  const wrap = el('div', { class: 'block' }, head);
  switch (b.type) {
    case 'text': {
      let text = b.text ?? '', pretty = null;
      try { const p = JSON.parse(text); if (typeof p === 'object' && p) pretty = JSON.stringify(p, null, 2); } catch { }
      if (pretty) head.append(el('span', { class: 'badge', text: 'json' }));
      head.append(el('button', { class: 'btn small', text: 'Copy', onclick: e => copy(text, e.target) }));
      wrap.append(el('pre', { text: pretty ?? text }));
      break;
    }
    case 'image': wrap.append(el('img', { src: `data:${b.mimeType};base64,${b.data}`, alt: 'image result' })); break;
    case 'audio': wrap.append(el('audio', { controls: true, src: `data:${b.mimeType};base64,${b.data}` })); break;
    case 'resource_link': wrap.append(el('div', {}, el('code', { text: b.uri }), b.name ? ' · ' + b.name : '', b.description ? el('div', { class: 'muted', text: b.description }) : null)); break;
    case 'resource': {
      const r = b.resource || {};
      wrap.append(el('div', { class: 'muted', text: `${r.uri || ''} ${r.mimeType || ''}` }), el('pre', { text: r.text ?? (r.blob ? `[${r.blob.length} base64 chars]` : JSON.stringify(r, null, 2)) }));
      break;
    }
    default: wrap.append(el('pre', { text: JSON.stringify(b, null, 2) }));
  }
  return wrap;
}

function copy(text, btn) {
  navigator.clipboard?.writeText(text).then(() => { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = t, 1200); });
}

// ---------- Headers dialog ----------
function renderHeaders() {
  const box = $('#hdrDefs');
  box.replaceChildren();
  if (defs().length) {
    box.append(el('div', { class: 'section-t', text: 'Defined by this project' }));
    for (const d of defs()) {
      const input = el('input', { type: d.secret ? 'password' : 'text', placeholder: d.placeholder || '', value: defValue(d), spellcheck: 'false', autocomplete: 'off',
        oninput: e => { state.hdr.values[d.name] = e.target.value; saveHeaders(); } });
      const on = el('input', { type: 'checkbox', title: 'Send this header', onchange: e => { if (e.target.checked) delete state.hdr.disabled[d.name]; else state.hdr.disabled[d.name] = true; saveHeaders(); } });
      on.checked = !state.hdr.disabled[d.name];
      box.append(el('div', { class: 'hdr-def' },
        el('div', { class: 'top' }, on, el('code', { text: d.name }),
          d.required ? el('span', { class: 'badge err', text: 'required' }) : null,
          d.secret ? el('span', { class: 'badge', text: 'secret' }) : null,
          serverHas(d.name) ? el('span', { class: 'badge ok', text: 'set by server' }) : null),
        d.description ? el('div', { class: 'hint muted', style: 'font-size:12px;margin-bottom:4px', text: d.description }) : null,
        el('div', { class: 'val' }, input,
          d.secret ? el('button', { class: 'btn small', type: 'button', text: 'Show', onclick: e => { const show = input.type === 'password'; input.type = show ? 'text' : 'password'; e.target.textContent = show ? 'Hide' : 'Show'; } }) : null,
          d.defaultValue != null ? el('button', { class: 'btn small', type: 'button', text: 'Default', title: 'Restore default value', onclick: () => { delete state.hdr.values[d.name]; saveHeaders(); renderHeaders(); } }) : null)));
    }
  }
  $('#hdrRows').replaceChildren(...state.hdr.custom.map((h, i) => {
    const on = el('input', { type: 'checkbox', title: 'Send this header', onchange: e => { h.enabled = e.target.checked; saveHeaders(); } });
    on.checked = h.enabled !== false;
    return el('div', { class: 'kv' }, on,
      el('input', { type: 'text', placeholder: 'Name (e.g. X-Tenant-Id)', value: h.name || '', spellcheck: 'false', oninput: e => { h.name = e.target.value; saveHeaders(); } }),
      el('input', { type: 'text', placeholder: 'Value', value: h.value || '', spellcheck: 'false', oninput: e => { h.value = e.target.value; saveHeaders(); } }),
      el('button', { class: 'btn small', text: '✕', title: 'Remove', onclick: () => { state.hdr.custom.splice(i, 1); saveHeaders(); renderHeaders(); } }));
  }));
  if (!state.hdr.custom.length) $('#hdrRows').append(el('p', { class: 'muted', style: 'margin:0 0 6px', text: 'Add any other header the server needs.' }));
  const srv = state.config?.serverHeaders || [];
  $('#hdrServer').replaceChildren(...(srv.length ? [el('p', { class: 'muted', style: 'font-size:12px', text: 'Also added on the server (values hidden): ' + srv.join(', ') })] : []));
}
function openHeaders() { renderHeaders(); $('#headersDlg').showModal(); }
$('#headersBtn').onclick = openHeaders;
$('#hdrClose').onclick = () => { $('#headersDlg').close(); connect(); };
$('#addHdr').onclick = () => { state.hdr.custom.push({ name: '', value: '', enabled: true }); renderHeaders(); };

// ---------- Boot ----------
$('#search').oninput = renderList;
$('#connectBtn').onclick = connect;
$('#endpoint').onkeydown = e => { if (e.key === 'Enter') connect(); };
$('.logo').style.cursor = 'pointer'; $('.logo').onclick = () => { history.replaceState(null, '', location.pathname); renderOverview(); };

(async () => {
  state.config = await api('config');
  document.title = state.config.title;
  const ep = $('#endpoint');
  ep.value = state.config.allowCustomEndpoint ? store.get('endpoint', state.config.endpoint) : state.config.endpoint;
  ep.readOnly = !state.config.allowCustomEndpoint;
  updateHeaderBtn();
  connect();
})();
})();
</script>
