<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%2318181b%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--sunken:#f7f7f8;--hover:#f2f2f4;--border:#e4e4e7;--border-strong:#d4d4d8;
  --text:#18181b;--text-2:#3f3f46;--muted:#71717a;
  --primary:#18181b;--primary-text:#ffffff;--focus:#2563eb;--focus-ring:rgba(37,99,235,.18);
  --ok:#15803d;--err:#b91c1c;--warn:#a16207;
  --code-bg:#f7f7f8;--code-text:#27272a;--code-key:#1d4ed8;--code-str:#15803d;--code-num:#b45309;
  --radius:6px;--sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0b0d;--panel:#111113;--sunken:#16161a;--hover:#1c1c21;--border:#26262b;--border-strong:#34343a;
  --text:#ededef;--text-2:#c8c8cd;--muted:#8b8b93;
  --primary:#ededef;--primary-text:#111113;--focus:#60a5fa;--focus-ring:rgba(96,165,250,.22);
  --ok:#4ade80;--err:#f87171;--warn:#facc15;
  --code-bg:#16161a;--code-text:#d4d4d8;--code-key:#93c5fd;--code-str:#86efac;--code-num:#fcd34d;
}}
:root[data-theme=dark]{
  --bg:#0b0b0d;--panel:#111113;--sunken:#16161a;--hover:#1c1c21;--border:#26262b;--border-strong:#34343a;
  --text:#ededef;--text-2:#c8c8cd;--muted:#8b8b93;
  --primary:#ededef;--primary-text:#111113;--focus:#60a5fa;--focus-ring:rgba(96,165,250,.22);
  --ok:#4ade80;--err:#f87171;--warn:#facc15;
  --code-bg:#16161a;--code-text:#d4d4d8;--code-key:#93c5fd;--code-str:#86efac;--code-num:#fcd34d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.55 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
header{display:flex;align-items:center;gap:16px;height:52px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand .mark{width:22px;height:22px;border-radius:5px;background:var(--primary);color:var(--primary-text);display:grid;place-items:center;font:600 11px/1 var(--mono);letter-spacing:-.02em;flex:none}
.brand .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sep{width:1px;height:20px;background:var(--border)}
.server-meta{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--err)}
.endpoint{display:flex;align-items:stretch;flex:1;min-width:240px;max-width:620px;margin-left:auto;height:32px}
.endpoint .btn{margin-left:8px;height:32px}
.picker{position:relative;flex:1;min-width:0}
.picker-btn{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);cursor:pointer;text-align:left}
.picker-btn:hover{border-color:var(--border-strong)}
.picker-btn.static{cursor:default}.picker-btn.static:hover{border-color:var(--border)}
.picker-btn .pk-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.picker-btn .pk-url{font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.picker-btn svg{color:var(--muted)}
.picker-menu{position:absolute;top:38px;left:0;min-width:100%;width:max-content;max-width:min(440px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;z-index:20}
.pk-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 8px;border-radius:5px;cursor:pointer}
.pk-item:hover{background:var(--hover)}
.pk-item.active{background:var(--sunken);box-shadow:0 0 0 1px var(--border)}
.pk-item .t{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-item .u{font:11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-item .st{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pk-item .st.err{color:var(--err)}.pk-item .st.warn{color:var(--warn)}
.pk-sep{height:1px;background:var(--border);margin:6px 2px}
.pk-add{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:none;background:none;border-radius:5px;cursor:pointer;color:var(--text-2);font-size:13px}
.pk-add:hover{background:var(--hover);color:var(--text)}
.dot.need{background:var(--warn)}

/* controls */
input[type=text],input[type=number],input[type=url],input[type=email],input[type=date],input[type=datetime-local],input[type=password],select,textarea{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring)}
input[readonly]{background:var(--sunken);color:var(--muted)}
textarea{font-family:var(--mono);font-size:12.5px;min-height:90px;resize:vertical}
input[type=checkbox]{accent-color:var(--primary);width:14px;height:14px;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);padding:0 12px;height:30px;cursor:pointer;white-space:nowrap;font-weight:500;font-size:13px;color:var(--text-2);transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--border-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.small{height:24px;padding:0 8px;font-size:12px}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.small.icon{width:24px}
.btn:disabled{opacity:.55;cursor:default}
.btn.attn{border-color:var(--err);color:var(--err)}
.btn .count-pill{font:500 11px/1 var(--mono);color:var(--muted)}

/* layout */
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);flex:1;min-height:0}
aside{border-right:1px solid var(--border);background:var(--sunken);display:flex;flex-direction:column;min-height:0}
.search{padding:12px 12px 8px;position:relative}
.search svg{position:absolute;left:22px;top:21px;color:var(--muted)}
.search input{padding-left:30px;background:var(--panel)}
.list-h{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list-h span:last-child{font-family:var(--mono);letter-spacing:0;font-weight:500}
.tool-list{overflow:auto;flex:1;padding:0 8px 12px}
.tool-item{position:relative;padding:7px 10px 7px 12px;border-radius:5px;cursor:pointer;margin-bottom:1px}
.tool-item:hover{background:var(--hover)}
.tool-item.active{background:var(--panel);box-shadow:0 0 0 1px var(--border)}
.tool-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--primary)}
.tool-item .name{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--text);word-break:break-all}
.tool-item .desc{color:var(--muted);font-size:12px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{overflow:auto;min-width:0}
.content{max-width:960px;padding:28px 32px 48px}
.empty{color:var(--muted);text-align:center;margin-top:96px;font-size:13px}

/* tool page */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tool-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.tool-title h2{margin:0 6px 0 0;font:600 20px/1.3 var(--mono);letter-spacing:-.01em;word-break:break-all}
.tool-subtitle{font-weight:500;color:var(--text-2);margin-bottom:2px}
.tool-desc{color:var(--muted);margin:0 0 22px;white-space:pre-wrap;max-width:72ch}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--sans);padding:4px 7px;border-radius:4px;border:1px solid var(--border);color:var(--muted);background:var(--panel)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.tag.plain::before{display:none}
.tag.ok{color:var(--ok)}.tag.err{color:var(--err)}.tag.warn{color:var(--warn)}
.badge{font:500 11px/1 var(--mono);padding:3px 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
.badge.ok{color:var(--ok)}.badge.err{color:var(--err)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:20px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{margin:0;font-size:13px;font-weight:600}
.card-b{padding:18px 16px}
.card-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:var(--sunken)}
.tabs{display:flex;gap:2px;margin-left:auto;align-self:stretch}
.tab{border:none;background:none;padding:0 10px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--primary)}

.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field>label,.field>.lbl{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;font:500 12.5px/1.4 var(--mono);color:var(--text)}
.field .type{font-size:11.5px;color:var(--muted);font-weight:400}
.field .req{color:var(--err);font:500 11px/1 var(--sans)}
.field .hint{color:var(--muted);font-size:12px;margin-top:5px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--err)}
.nested{border-left:1px solid var(--border);padding:2px 0 2px 14px;margin-top:4px}
.arr-row{display:flex;gap:6px;margin-bottom:6px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
pre{margin:0;background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);padding:12px 14px;border-radius:var(--radius);overflow:auto;font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:520px}
pre .k{color:var(--code-key)}pre .s{color:var(--code-str)}pre .n{color:var(--code-num)}pre .b{color:var(--code-num)}
.block{margin-bottom:14px}
.block:last-child{margin-bottom:0}
.block .bh{font-size:11.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;font-family:var(--mono)}
.block .bh .btn{margin-left:auto}
.block img{max-width:100%;border-radius:var(--radius);border:1px solid var(--border)}
.muted{color:var(--muted)}
.error-box{border:1px solid color-mix(in srgb,var(--err) 35%,transparent);background:color-mix(in srgb,var(--err) 6%,transparent);color:var(--err);padding:10px 12px;border-radius:var(--radius);white-space:pre-wrap;font-size:12.5px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:14px;user-select:none}
details[open] summary{margin-bottom:8px}
.status-line{display:flex;align-items:center;gap:10px;font-size:12.5px}
.status-line .meta+.meta{padding-left:10px;border-left:1px solid var(--border)}
.status-line .stat{font-weight:600}
.status-line .stat.ok{color:var(--ok)}.status-line .stat.err{color:var(--err)}
.status-line .meta{color:var(--muted);font-family:var(--mono);font-size:12px}
.kv-table{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:12.5px;margin:0 0 14px}
.kv-table dt{color:var(--muted)}.kv-table dd{margin:0;font-family:var(--mono);word-break:break-all}

/* headers dialog */
dialog{border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);width:min(620px,calc(100vw - 32px));padding:0;box-shadow:0 16px 48px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(9,9,11,.45)}
.dlg-h{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.dlg-h h3{margin:0 0 2px;font-size:14px;font-weight:600}
.dlg-h p{margin:0;color:var(--muted);font-size:12.5px}
.dlg-b{padding:4px 18px 16px;max-height:min(68vh,640px);overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);background:var(--sunken)}
.section-t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.hdr-def{padding:10px 0;border-bottom:1px solid var(--border)}
.hdr-def:last-child{border-bottom:none}
.hdr-def .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.hdr-def .top code{font:500 12.5px var(--mono)}
.hdr-def .val{display:flex;gap:6px;align-items:center}
.hdr-def .val input{font-family:var(--mono);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,.8fr) minmax(0,1.2fr) auto;gap:6px;margin-bottom:6px;align-items:center}
.kv input[type=text]{font-family:var(--mono);font-size:12.5px}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.presets .lead{font-size:12px;color:var(--muted);margin-right:2px}
.preset{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px dashed var(--border-strong);border-radius:var(--radius);background:none;cursor:pointer;font:500 12px var(--mono);color:var(--text-2)}
.preset:hover{border-style:solid;background:var(--hover);color:var(--text)}
.preset .ex{color:var(--muted);font-weight:400}
.preset svg{color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.instructions{white-space:pre-wrap;color:var(--text-2);font-size:13px;margin:0 0 14px}
@media (max-width:760px){
  header{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px}
  .sep,.server-meta{display:none}
  .picker-btn .pk-url{display:none}
  .picker-btn .pk-name{max-width:none;flex:1}
  .endpoint{max-width:none;margin-left:0;flex-basis:100%}
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .tabs .tab{padding:0 8px}
  aside{border-right:none;border-bottom:1px solid var(--border);max-height:38vh}
  .content{padding:20px 16px 40px}
  .kv{grid-template-columns:auto 1fr auto}.kv input:nth-of-type(3){grid-column:2/3}
}
</style>
</head>
<body>
<header>
  <div class="brand" id="brand" title="Server overview"><span class="mark">M</span><span class="name" id="title">{{TITLE}}</span></div>
  <span class="sep"></span>
  <div class="server-meta"><span id="serverMeta">Not connected</span></div>
  <div class="endpoint">
    <div class="picker">
      <button class="picker-btn" id="pickerBtn" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="dot" id="dot"></span><span class="pk-name" id="pickName">…</span><span class="pk-url" id="pickUrl"></span><svg class="i" id="pickChev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="picker-menu" id="pickerMenu" role="listbox" hidden></div>
    </div>
    <button class="btn" id="headersBtn" title="Request headers">Headers <span class="count-pill" id="hdrCount"></span></button>
    <button class="btn primary" id="connectBtn">Connect</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="text" id="search" placeholder="Filter tools" aria-label="Filter tools"></div>
    <div class="list-h"><span>Tools</span><span id="count"></span></div>
    <div class="tool-list" id="toolList"></div>
  </aside>
  <main id="main"><div class="empty">Connect to an MCP server to see its tools.</div></main>
</div>

<dialog id="headersDlg">
  <div class="dlg-h"><h3>Request headers</h3><p>Sent to the MCP server with every list and call request. Values are stored in this browser only.</p></div>
  <div class="dlg-b">
    <div id="hdrDefs"></div>
    <div class="section-t">Custom headers</div>
    <div class="presets" id="hdrPresets"></div>
    <div id="hdrRows"></div>
    <button class="btn small ghost" id="addHdr"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add empty header</button>
    <div id="hdrServer"></div>
  </div>
  <div class="dlg-f">
    <button class="btn" id="hdrCancel">Close</button>
    <button class="btn primary" id="hdrClose">Save and reconnect</button>
  </div>
</dialog>

<dialog id="addSrvDlg">
  <form method="dialog" id="addSrvForm">
    <div class="dlg-h"><h3>Add MCP server</h3><p>A temporary server, saved in this browser only. Requests go through this app.</p></div>
    <div class="dlg-b">
      <div class="field" style="margin-top:14px"><label for="srvName">Name</label><input type="text" id="srvName" placeholder="Payments staging" autocomplete="off"></div>
      <div class="field"><label for="srvUrl">MCP endpoint</label><input type="text" id="srvUrl" placeholder="https://example.com/mcp" spellcheck="false" autocomplete="off" required></div>
      <div class="error-box" id="srvErr" hidden></div>
    </div>
    <div class="dlg-f">
      <button class="btn" type="button" id="srvCancel">Cancel</button>
      <button class="btn primary" type="submit" id="srvAdd">Add and connect</button>
    </div>
  </form>
</dialog>

<script>
(() => {
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
};
const ICONS = {
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  play: '<path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
};
const icon = n => { const t = document.createElement('template'); t.innerHTML = `<svg class="i" viewBox="0 0 24 24">${ICONS[n]}</svg>`; return t.content.firstChild; };
// Pretty JSON with light syntax colouring; values are escaped via textContent.
function jsonPre(value) {
  const pre = el('pre');
  const src = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let last = 0, m;
  while ((m = re.exec(src))) {
    if (m.index > last) pre.append(src.slice(last, m.index));
    const cls = m[1] ? (m[2] ? 'k' : 's') : m[3] ? 'b' : 'n';
    pre.append(el('span', { class: cls, text: m[1] || m[0] }));
    if (m[2]) pre.append(m[2]);
    last = re.lastIndex;
  }
  pre.append(src.slice(last));
  return pre;
}
const page = (...kids) => el('div', { class: 'content' }, ...kids);
const store = {

// ---------- Servers ----------

// ---------- Headers model ----------

// ---------- API ----------
async function api(path, body, s) {

  if (s) for (const [k, v] of Object.entries(activeHeaders(s))) headers['X-McpExplorer-Header-' + k] = v;
  const res = await fetch('api/' + path, { method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined });
  let data; try { data = await res.json(); } catch { data = { ok: false, error: 'HTTP ' + res.status }; }
  return data;
}

// ---------- Connect ----------
// One request per server: initialize + tools/list. Used for the selected server and for the status dots.
async function probe(s) {

  state.status[s.id] = { ...state.status[s.id], state: 'loading' }; renderPicker();
  const r = await api('connect', target(s), s);
  state.status[s.id] = r.ok
    ? { state: 'ok', tools: (r.tools || []).length, name: r.server?.title || r.server?.name, result: r }
    : { state: 'err', error: r.error || 'Unknown error' };
  renderPicker();
  return state.status[s.id];
}

      el('div', { class: 'card-h' }, el('h3', { text: 'Headers required' })),
      el('div', { class: 'card-b' }, el('p', { style: 'margin:0 0 14px', text: 'This server needs the following headers before it can be reached: ' + miss.join(', ') + '.' }),
        el('button', { class: 'btn primary', text: 'Open headers', onclick: openHeaders })))));

  $('#serverMeta').textContent = 'Connecting…';

      el('div', { class: 'card-h' }, el('h3', { text: 'Could not connect' })),

  }

  $('#serverMeta').textContent = `${info.title || info.name || 'MCP server'}${info.version ? ' ' + info.version : ''} · ${r.protocolVersion || '?'} · ${r.elapsedMs} ms`;

  renderList();

// ---------- Server picker ----------

// ---------- Schema helpers ----------
const typeOf = s => {

  let t = s.type;
  if (Array.isArray(t)) t = t.find(x => x !== 'null') || 'null';
  if (!t && s.enum) t = typeof s.enum[0] === 'number' ? 'number' : 'string';
  if (!t && s.properties) t = 'object';

    case 'string': return s.format === 'date' ? new Date().toISOString().slice(0, 10) : s.format === 'date-time' ? new Date().toISOString() : '';

// ---------- Form generation ----------
// Each builder returns { node, get(): {value, set: bool, error?} , set(value) }

    const long = (schema.maxLength || 0) > 200 || /text|content|body|query|prompt|message/i.test(name) && !schema.maxLength;

// ---------- Tool view ----------

  const hasProps = Object.keys(schema.properties || {}).length > 0;
  const form = buildObject(schema);
  const json = el('textarea', { rows: 12, spellcheck: 'false' });
  let mode = 'form', shown = 'form';

  const draft = state.drafts[draftKey];
  form.set(draft ?? schema.default ?? {});
  json.value = JSON.stringify(draft ?? exampleFor(schema) ?? {}, null, 2);

  const currentArgs = () => {
    if (mode === 'json') { try { return { value: json.value.trim() ? JSON.parse(json.value) : {} }; } catch (e) { return { error: 'Invalid JSON: ' + e.message }; } }
    return form.get();
  };

    if (m === shown) return;

      if (m === 'json') { const r = form.get(); json.value = JSON.stringify(r.error ? {} : r.value, null, 2); }
      else { try { form.set(JSON.parse(json.value || '{}')); } catch { } }

    el('button', { class: 'tab' + (m === 'form' ? ' active' : ''), 'data-m': m, text: label, onclick: () => setMode(m) })));

    tool.outputSchema ? el('div', { class: 'block' }, el('div', { class: 'bh', text: 'Output schema' }), jsonPre(tool.outputSchema)) : null);

    const a = currentArgs();

    run.disabled = true; run.replaceChildren(el('span', { class: 'spin' }), 'Sending…');
    const s = server();
    const r = await api('call', { ...target(s), tool: tool.name, arguments: a.value }, s);
    if (s.id !== server().id) return;
    run.disabled = false; run.replaceChildren(...runLabel());
    resultCard.replaceChildren(renderResult(r, tool, a.value));
  }}, ...runLabel());
  const copyRpc = el('button', { class: 'btn', title: 'Copy the raw tools/call request', onclick: () => {
    const a = currentArgs();
    copy(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call', params: { name: tool.name, arguments: a.value || {} } }, null, 2), copyRpc);
  }}, icon('copy'), 'Copy JSON-RPC');
  const reset = el('button', { class: 'btn ghost', style: 'margin-left:auto', onclick: () => { delete state.drafts[draftKey]; select(tool); } }, icon('reset'), 'Reset');

  const ann = tool.annotations || {};
  const badges = [
    ann.readOnlyHint && el('span', { class: 'tag ok', text: 'Read-only' }),
    ann.destructiveHint && !ann.readOnlyHint && el('span', { class: 'tag err', text: 'Destructive' }),
    ann.idempotentHint && el('span', { class: 'tag plain', text: 'Idempotent' }),
    ann.openWorldHint && el('span', { class: 'tag warn', text: 'Open world' }),
    tool.outputSchema && el('span', { class: 'tag plain', text: 'Structured output' }),
  ].filter(Boolean);

  $('#main').replaceChildren(page(...[
    el('div', { class: 'eyebrow', text: 'Tool' }),
    el('div', { class: 'tool-title' }, el('h2', { text: tool.name }), ...badges),
    tool.title || ann.title ? el('div', { class: 'tool-subtitle', text: tool.title || ann.title }) : null,
    el('p', { class: 'tool-desc', text: tool.description || 'No description.' }),
    el('div', { class: 'card' },
      el('div', { class: 'card-h' }, el('h3', { text: 'Parameters' }), tabs),
      el('div', { class: 'card-b' }, schemaBox, formBox, jsonBox, errBox),
      el('div', { class: 'card-f' }, run, copyRpc, reset)),
    resultCard].filter(Boolean)));
  $("#main").scrollTop = 0;
}

function renderResult(r, tool, args) {
  const body = el('div', { class: 'card-b' });
  let badge;
  if (!r.ok) {
    badge = el('span', { class: 'stat err', text: 'Request failed' });
    body.append(el('div', { class: 'error-box', text: r.error || 'Unknown error' }));
  } else {
    const res = r.result || {};
    badge = res.isError ? el('span', { class: 'stat err', text: 'Tool error' }) : el('span', { class: 'stat ok', text: 'Success' });
    const blocks = res.content || [];
    blocks.forEach((b, i) => body.append(renderBlock(b, i)));
    if (res.structuredContent !== undefined) body.append(el('div', { class: 'block' }, el('div', { class: 'bh', text: 'structuredContent' }), jsonPre(res.structuredContent)));
    if (!blocks.length && res.structuredContent === undefined) body.append(el('p', { class: 'muted', style: 'margin:0', text: 'Empty result.' }));
    body.append(el('details', {}, el('summary', { text: 'Raw response' }), jsonPre(res)));
  }
  return el('div', { class: 'card' },
    el('div', { class: 'card-h' }, el('h3', { text: 'Response' }),
      el('div', { class: 'status-line', style: 'margin-left:auto' }, el('span', { class: 'dot ' + (r.ok && !r.result?.isError ? 'on' : 'off') }), badge,
        el('span', { class: 'meta', text: `${r.elapsedMs ?? '?'} ms` }), el('span', { class: 'meta', text: new Date().toLocaleTimeString() }))),
    body);
}

function renderBlock(b, i) {
  const head = el('div', { class: 'bh' }, el('span', { text: `content[${i}] · ${b.type}` }));
  const wrap = el('div', { class: 'block' }, head);
  switch (b.type) {
    case 'text': {
      let text = b.text ?? '', pretty = null;
      try { const p = JSON.parse(text); if (typeof p === 'object' && p) pretty = JSON.stringify(p, null, 2); } catch { }
      if (pretty) head.append(el('span', { class: 'badge', text: 'json' }));
      const cb = el('button', { class: 'btn small ghost', onclick: () => copy(text, cb) }, icon('copy'), 'Copy');
      head.append(cb);
      wrap.append(pretty ? jsonPre(pretty) : el('pre', { text }));
      break;
    }
    case 'image': wrap.append(el('img', { src: `data:${b.mimeType};base64,${b.data}`, alt: 'image result' })); break;
    case 'audio': wrap.append(el('audio', { controls: true, src: `data:${b.mimeType};base64,${b.data}` })); break;
    case 'resource_link': wrap.append(el('div', {}, el('code', { text: b.uri }), b.name ? ' · ' + b.name : '', b.description ? el('div', { class: 'muted', text: b.description }) : null)); break;
    case 'resource': {
      const r = b.resource || {};
      wrap.append(el('div', { class: 'muted', text: `${r.uri || ''} ${r.mimeType || ''}` }), el('pre', { text: r.text ?? (r.blob ? `[${r.blob.length} base64 chars]` : JSON.stringify(r, null, 2)) }));
      break;
    }
    default: wrap.append(jsonPre(b));
  }
  return wrap;
}

function copy(text, btn) {
  navigator.clipboard?.writeText(text).then(() => { const kids = [...btn.childNodes]; btn.replaceChildren('Copied'); setTimeout(() => btn.replaceChildren(...kids), 1200); });
}

// ---------- Headers dialog ----------
function renderHeaders() {
  const box = $('#hdrDefs');
  box.replaceChildren();
  if (defs().length) {
    box.append(el('div', { class: 'section-t', text: 'Defined by this project' }));
    for (const d of defs()) {
      const input = el('input', { type: d.secret ? 'password' : 'text', placeholder: d.placeholder || '', value: defValue(d), spellcheck: 'false', autocomplete: 'off', 'data-def': d.name.toLowerCase(),
        oninput: e => { state.hdr.values[d.name] = e.target.value; saveHeaders(); } });
      const on = el('input', { type: 'checkbox', title: 'Send this header', onchange: e => { if (e.target.checked) delete state.hdr.disabled[d.name]; else state.hdr.disabled[d.name] = true; saveHeaders(); } });
      on.checked = !state.hdr.disabled[d.name];
      box.append(el('div', { class: 'hdr-def' },
        el('div', { class: 'top' }, on, el('code', { text: d.name }),
          d.required ? el('span', { class: 'badge err', text: 'required' }) : null,
          d.secret ? el('span', { class: 'badge', text: 'secret' }) : null,
          serverHas(d.name) ? el('span', { class: 'badge ok', text: 'set by server' }) : null),
        d.description ? el('div', { class: 'muted', style: 'font-size:12px;margin-bottom:6px', text: d.description }) : null,
        el('div', { class: 'val' }, input,
          d.secret ? el('button', { class: 'btn', type: 'button', text: 'Show', onclick: e => { const show = input.type === 'password'; input.type = show ? 'text' : 'password'; e.target.textContent = show ? 'Hide' : 'Show'; } }) : null,
          d.defaultValue != null ? el('button', { class: 'btn', type: 'button', text: 'Default', title: 'Restore default value', onclick: () => { delete state.hdr.values[d.name]; saveHeaders(); renderHeaders(); } }) : null)));
    }
  }
  $('#hdrRows').replaceChildren(...state.hdr.custom.map((h, i) => {
    const on = el('input', { type: 'checkbox', title: 'Send this header', onchange: e => { h.enabled = e.target.checked; saveHeaders(); } });
    on.checked = h.enabled !== false;
    return el('div', { class: 'kv' }, on,
      el('input', { type: 'text', placeholder: 'Header name', value: h.name || '', spellcheck: 'false', autocomplete: 'off', oninput: e => { h.name = e.target.value; saveHeaders(); } }),
      el('input', { type: 'text', placeholder: 'Value', value: h.value || '', spellcheck: 'false', autocomplete: 'off', 'data-row': i, oninput: e => { h.value = e.target.value; saveHeaders(); } }),
      el('button', { class: 'btn icon', title: 'Remove header', 'aria-label': 'Remove header', onclick: () => { state.hdr.custom.splice(i, 1); saveHeaders(); renderHeaders(); } }, icon('x')));
  }));
  // Presets for headers the project already defines are hidden, except auth schemes that pre-fill a prefix.
  const defined = new Set(defs().map(d => d.name.toLowerCase()));
  const presets = HEADER_PRESETS.filter(p => !defined.has(p.name.toLowerCase()) || p.hint);
  $('#hdrPresets').replaceChildren(el('span', { class: 'lead', text: 'Quick add:' }), ...presets.map(p => el('button', { class: 'preset', type: 'button', title: `Add ${p.name}${p.value ? ': ' + p.value : ''}`, onclick: () => applyPreset(p) },
    icon('plus'), p.name, p.hint ? el('span', { class: 'ex', text: p.hint }) : null)));
  const srv = state.config?.serverHeaders || [];
  $('#hdrServer').replaceChildren(...(srv.length ? [el('p', { class: 'muted', style: 'font-size:12px', text: 'Also added on the server (values hidden): ' + srv.join(', ') })] : []));
}
// Quick-add suggestions. Clicking one adds the header (or fills a project-defined one) and focuses the value,
// so the user only has to paste the token. Name and value stay fully editable afterwards.
const HEADER_PRESETS = [
  { name: 'Authorization', value: 'Bearer ', hint: 'Bearer' },
  { name: 'Authorization', value: 'Basic ', hint: 'Basic' },
  { name: 'X-API-Key', value: '' },
  { name: 'X-Refresh-Token', value: '' },
  { name: 'X-Tenant-Id', value: '' },
  { name: 'Accept-Language', value: navigator.language || 'en-US' },
  { name: 'X-Correlation-Id', value: () => crypto.randomUUID?.() || Date.now().toString(36) },
];
function applyPreset(p) {
  const value = typeof p.value === 'function' ? p.value() : p.value;
  const key = p.name.toLowerCase();
  const def = defs().find(d => d.name.toLowerCase() === key);
  let sel;
  if (def) {
    delete state.hdr.disabled[def.name];
    if (!defValue(def).trim() || /^(bearer|basic)\s*$/i.test(defValue(def))) state.hdr.values[def.name] = value;
    sel = `[data-def="${CSS.escape(key)}"]`;
  } else {
    let i = state.hdr.custom.findIndex(c => (c.name || '').trim().toLowerCase() === key);
    if (i < 0) { state.hdr.custom.push({ name: p.name, value, enabled: true }); i = state.hdr.custom.length - 1; }
    else {
      const c = state.hdr.custom[i]; c.enabled = true;
      if (!(c.value || '').trim() || /^(bearer|basic)\s*$/i.test(c.value)) c.value = value;
    }
    sel = `[data-row="${i}"]`;
  }
  saveHeaders(); renderHeaders();
  const input = $('#headersDlg ' + sel);
  if (input) { input.focus(); const n = input.value.length; try { input.setSelectionRange(n, n); } catch { } }
}
function openHeaders() {
  $('#headersDlg .dlg-h h3').textContent = multi() ? 'Request headers · ' + serverName(server()) : 'Request headers';
  $('#headersDlg .dlg-h p').textContent = `Sent to ${multi() ? serverName(server()) : 'the MCP server'} with every list and call request. Values are stored in this browser only${multi() ? ', separately for each server' : ''}.`;
  renderHeaders(); $('#headersDlg').showModal();
}
$('#hdrCancel').onclick = () => $('#headersDlg').close();
$('#headersBtn').onclick = openHeaders;
$('#hdrClose').onclick = () => { $('#headersDlg').close(); connect(); };
$('#addHdr').onclick = () => { state.hdr.custom.push({ name: '', value: '', enabled: true }); renderHeaders(); };

// ---------- Boot ----------
$('#search').oninput = renderList;
$('#connectBtn').onclick = connect;
$('#brand').onclick = () => { setHash(''); renderOverview(); };

(async () => {
  state.config = await api('config');
  document.title = state.config.title;
  const fromHash = parseHash().server, saved = store.get('server', null);
  state.serverId = (fromHash && server(fromHash)?.id === fromHash) ? fromHash : server(saved)?.id ?? servers()[0].id;
  renderPicker(); updateHeaderBtn();
  await connect();
  // Fill in the status dots of the other servers in the background.
  for (const s of servers()) if (s.id !== state.serverId) probe(s);
})();
})();
</script>
</body>
